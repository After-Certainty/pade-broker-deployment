# Credential-free CI: validate scripts, providers, config render, and runtime image build.
# Does NOT authenticate to Google Cloud, access Secret Manager, or deploy.
name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh

      - name: Subject config contract test
        run: make test-config-contract

      - name: Set up Go
        # actions/setup-go@v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.22"
          cache: false

      - name: Provider unit tests
        run: make test-providers

      - name: Write CI fixture .env
        # Fake identifiers only — never production values or secrets.
        run: |
          cat > .env <<'EOF'
          PROJECT_ID=pade-ci-fixture
          PROJECT_NUMBER=123456789012
          GITHUB_APP_ID=100001
          GITHUB_APP_INSTALLATION_ID=200002
          GITHUB_REPOSITORIES=ci-fixture/pade-broker-deployment
          GA_PROPERTY_ID=properties/987654321
          CURSOR_OIDC_SUBJECT=user:ci-fixture-subject
          EOF

      - name: Render config
        run: make render-config

      - name: Build runtime overlay image
        run: make build
