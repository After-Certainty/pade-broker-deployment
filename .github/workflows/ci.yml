# Credential-free CI: validate scripts, providers, config render, and runtime image build.
# Does NOT authenticate to Google Cloud, access Secret Manager, or deploy.
name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh

      - name: Subject config contract test
        run: make test-config-contract

      - name: Set up Go
        # actions/setup-go@v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.22"
          cache: false

      - name: Provider unit tests
        run: make test-providers

      - name: Write CI fixture .env
        # Fake identifiers only — never production values or secrets.
        run: |
          cat > .env <<'EOF'
          PROJECT_ID=pade-ci-fixture
          PROJECT_NUMBER=123456789012
          GITHUB_APP_ID=100001
          GITHUB_APP_INSTALLATION_ID=200002
          GITHUB_REPOSITORIES=ci-fixture/pade-broker-deployment
          GA_PROPERTY_ID=properties/987654321
          CURSOR_OIDC_SUBJECT=user:ci-fixture-subject
          GCE_OIDC_SUBJECT=123456789012345678901
          AWS_S3_ROLE_ARN=arn:aws:iam::111122223333:role/pade-broker-experiment-007-s3-write
          AWS_S3_BUCKET=ci-fixture-007
          AWS_S3_REGION=us-east-1
          AWS_S3_AUDIENCE=https://ci.example.invalid/pade-aws-s3
          EOF

      - name: Render config
        run: make render-config

      - name: Assert AWS S3 policy/bindings contract
        run: |
          set -euo pipefail
          POLICY=config/.generated/broker-policy.yaml
          BINDINGS=config/.generated/broker-bindings.yaml
          grep -Fq 'aws.s3.bucket.write' "$POLICY"
          # GCE (google) rule includes AWS; Cursor rules must not.
          awk '
            /^  - issuer: google$/ {in_g=1; in_c=0; next}
            /^  - issuer: cursor$/ {in_c=1; in_g=0; next}
            /^  - issuer: / {in_g=0; in_c=0}
            in_g && /aws\.s3\.bucket\.write/ {g=1}
            in_c && /aws\.s3\.bucket\.write/ {c=1}
            END { if (!g) { print "FAIL: GCE policy missing aws.s3.bucket.write" > "/dev/stderr"; exit 1 }
                  if (c) { print "FAIL: Cursor policy must not include aws.s3.bucket.write" > "/dev/stderr"; exit 1 } }
          ' "$POLICY"
          grep -Fq '/providers/pade-provider-aws-s3' "$BINDINGS"
          grep -Fq 'roleArn: "arn:aws:iam::111122223333:role/pade-broker-experiment-007-s3-write"' "$BINDINGS"
          grep -Fq 'bucket: "ci-fixture-007"' "$BINDINGS"
          grep -Fq 'audience: "https://ci.example.invalid/pade-aws-s3"' "$BINDINGS"
          # No credential-shaped values in generated config.
          ! grep -Eiq 'AKIA[0-9A-Z]{16}|aws_secret_access_key|AWS_SECRET_ACCESS_KEY|BEGIN (RSA )?PRIVATE KEY' "$POLICY" "$BINDINGS"

      - name: Build runtime overlay image
        run: make build
